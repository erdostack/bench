name: Sync to Hugging Face

# Mirrors this repository to the dataset huggingface.co/datasets/erdostack/bench, where the case index can be
# browsed and loaded. Runs when a version tag is pushed, or by hand. It needs one repository secret, HF_TOKEN:
# a token for the erdostack organization on Hugging Face that may write to that dataset. Files removed here are
# removed there.
#
# The upload is the one the official action makes (huggingface/hub-sync v0.3.0, Apache-2.0: `hf repos create`,
# then `hf upload` with deletion), called directly. The action itself cannot be used here: it always leaves out
# every folder named .github, at any depth, and 45 fixture files of 41 cases sit in such folders, because a
# repository's CI file is part of what those cases are about. Here only this repository's own git and CI files
# at the root are left out: .gitattributes, .gitignore and .github/. The last step compares what the Hub holds
# with what git tracks, and fails if the two differ.
#
# What a mirror made this way cannot carry: executable bits, which 654 fixture files have, and this
# repository's .gitattributes, which keeps line endings as they are. So the mirror is for browsing and for
# loading the index; run the cases from a git clone.
#
# Not run yet at the time of writing: with about 60,000 small files the first sync may take a long while.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-hub
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror to the Hub
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: The check's own test
        run: python3 .github/scripts/check_mirror.py --selftest
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          uvx hf version
          uvx hf repos create erdostack/bench --type dataset --exist-ok
          uvx hf upload erdostack/bench . --type dataset \
            --exclude=".git*" \
            --delete="*" \
            --commit-message="Sync from ${GITHUB_REPOSITORY} at ${GITHUB_SHA}"
      - name: The mirror holds every tracked file
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --no-project --with huggingface_hub python .github/scripts/check_mirror.py erdostack/bench
