apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: pantry-pairs
deploy:
  helm:
    releases:
      - name: pantry-graph
        chartPath: deploy/chart
        valuesFiles:
          - deploy/values-local.yaml
        setValues:
          image.tag: "2026.10.0"
          auth.existingSecret: pantry-graph-auth
portForward:
  - resourceType: service
    resourceName: pantry-graph
    port: 7687
    localPort: 7687
