[package]
name = "tunebook"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Tunes, sets and what follows what"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
lbug = "0.21"

[[bin]]
name = "tq"
path = "src/bin/tq.rs"

[[bin]]
name = "load"
path = "src/bin/load.rs"

[profile.release]
lto = "thin"
