services:
  graph:
    image: neo4j:2025.10.1-community
    container_name: trailmap-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${GRAPH_PASSWORD:?set GRAPH_PASSWORD in config/local}"
    volumes:
      - ./conf:/conf
      - ./var/neo4j/data:/data
      - ./var/neo4j/logs:/logs
      - ./data:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12
