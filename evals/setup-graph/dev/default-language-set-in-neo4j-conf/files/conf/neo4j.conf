# trailmap development server. Mounted at /conf by docker-compose.yml.

server.default_listen_address=0.0.0.0
server.bolt.listen_address=:7687
server.http.listen_address=:7474

# a laptop, not a server
server.memory.heap.initial_size=512m
server.memory.heap.max_size=512m
server.memory.pagecache.size=256m

db.tx_log.rotation.retention_policy=2 days
db.transaction.timeout=30s
db.query.default_language=CYPHER_25
db.logs.query.enabled=INFO
db.logs.query.threshold=250ms

dbms.security.auth_minimum_password_length=8
server.directories.import=/import
