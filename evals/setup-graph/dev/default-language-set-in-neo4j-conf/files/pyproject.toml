[project]
name = "trailmap"
version = "0.5.1"
description = "Hut-to-hut route planning on a graph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "neo4j>=5.28,<7",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailmap"]
