[tool.poetry]
name = "bandtree"
version = "0.4.0"
description = "A family tree of a local music scene"
authors = ["bandtree contributors"]
packages = [{ include = "bandtree" }]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1"
real-ladybug = ">=0.12,<0.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.poetry.scripts]
bandtree-ask = "bandtree.ask:main"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
