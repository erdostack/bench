apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graph
spec:
  serviceName: graph
  replicas: 1
  selector:
    matchLabels:
      app: graph
  template:
    metadata:
      labels:
        app: graph
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26.24-community
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: graph-auth
                  key: auth
            - name: NEO4J_server_memory_heap_max__size
              value: 1G
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
