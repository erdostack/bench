apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "partsbin-graph.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: bolt
      port: {{ .Values.service.boltPort }}
      targetPort: bolt
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
