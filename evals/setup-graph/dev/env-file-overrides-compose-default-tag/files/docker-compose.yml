name: ferryboard

services:
  graph:
    image: neo4j:${GRAPH_TAG:-2025.10.1}-community
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_PASSWORD:?set GRAPH_PASSWORD}
      NEO4J_server_memory_heap_max__size: ${GRAPH_HEAP:-512m}
    ports:
      - "${GRAPH_HTTP_PORT:-7474}:7474"
      - "${GRAPH_BOLT_PORT:-7687}:7687"
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${GRAPH_PASSWORD}", "RETURN 1"]
      interval: 10s
      retries: 12

  api:
    build: .
    environment:
      GRAPH_URI: bolt://graph:7687
      GRAPH_PASSWORD: ${GRAPH_PASSWORD}
    depends_on:
      graph:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  graph-data:
