[project]
name = "ferryboard"
version = "0.7.1"
description = "Ferry connection planner"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.28,<7",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
