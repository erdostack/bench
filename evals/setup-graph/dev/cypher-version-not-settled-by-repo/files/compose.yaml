services:
  graph:
    image: neo4j:2026.05.0-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${STACKS_GRAPH_PASSWORD:?set STACKS_GRAPH_PASSWORD}"
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - graph-data:/data
      - ./dumps:/dumps

volumes:
  graph-data:
