apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      containers:
        - name: neo4j
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          envFrom:
            - secretRef: {name: {{ .Release.Name }}-auth}
          ports:
            - {name: bolt, containerPort: 7687}
          volumeMounts:
            - {name: conf, mountPath: /conf}
            - {name: data, mountPath: /data}
      volumes:
        - name: conf
          configMap: {name: {{ .Release.Name }}-conf}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.storage.size }}}}
