[tool.poetry]
name = "curio"
version = "0.14.0"
description = "Collections graph for a museum consortium"
authors = ["curio maintainers"]
packages = [{ include = "curio" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
neo4j = "^5.20"
networkx = "^3.4"
uvicorn = "^0.34"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
