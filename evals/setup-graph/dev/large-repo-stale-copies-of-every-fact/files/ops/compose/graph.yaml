name: curio

services:
  graph:
    image: neo4j:5.26.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${CURIO_GRAPH_PASSWORD:?source ops/compose/local.env.sh first}"
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_db_tx__log_rotation_retention__policy: "2 days"
    volumes:
      - curio-graph:/data
      - ../../data:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

volumes:
  curio-graph:
