name: ci
on: [push, pull_request]
jobs:
  gateway:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test
  accounts:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/accounts } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen && uv run pytest -q
  routing:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/routing } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m pytest -q
  lineage:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/lineage } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew --no-daemon test
  notifier:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/notifier } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go test ./...
