services:
  graph:
    build:
      context: ./infra/graph
      args:
        NEO4J_VERSION: "2025.11.2"
    environment:
      NEO4J_AUTH: neo4j/${DEPOTWALK_GRAPH_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - depot-graph:/data

volumes:
  depot-graph:
