services:
  db:
    image: postgres:${PG_TAG:-16.4}
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mesh
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4.1
    ports:
      - "6379:6379"

volumes:
  pg:
