# Picked up automatically by `docker compose up` on laptops and in CI.
services:
  graph:
    image: neo4j:2026.09.0-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./db/constraints.cypher:/var/lib/neo4j/import/constraints.cypher:ro
